<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- La pagina sta in tools/ ma i moduli e i dati vivono nella radice. -->
<base href="../">
<title>Test del curriculum — Parole &amp; Creature</title>
<style>
  body { font: 14px ui-monospace, Menlo, monospace; background: #111; color: #ddd; padding: 20px; line-height: 1.6; }
  h1 { font-size: 16px }
  .ok { color: #7ee787 } .ko { color: #ff7b72 } .note { color: #8b949e }
  #verdict { font-size: 18px; font-weight: bold; margin-top: 18px }
</style>
</head>
<body>
<h1>Test delle regole del curriculum</h1>
<div id="out">esecuzione...</div>

<!-- loadAll cerca questo contenitore per iniettare lo sprite -->
<div id="sprite-host" hidden></div>

<script type="module">
/*
 * Verifica le regole didattiche che il click a caso non puo' controllare:
 * la soglia di padronanza fra le fasi, il fatto che la padronanza non sia
 * accumulabile in una sola sessione, e la presenza del ripasso sistematico.
 *
 * Uso:
 *   python3 -m http.server 8080
 *   apri http://localhost:8080/tools/curriculum-test.html
 */
import { loadAll, content, getItem } from './js/content-loader.js';
import { save, resetSave, dayIndex } from './js/state.js';
import { recordAnswer, isMastered, distractors, distinctBySprite } from './js/srs.js';
import { serveAiutoScritto, SOGLIA_AIUTO } from './js/minigames.js';
import { chapters, chapterForCreature, pendingAfterRound, pendingAtStart, isAvailable, lineAudio } from './js/story.js';
import { planChest, nextSticker, stickers } from './js/chests.js';
import { pickMimeType, canRecord } from './js/recorder.js';
import { buildSummaryCard, canShare } from './js/share.js';
import { denItems, placeItem, removeItem, isPlaced, clamp, setWall, WALLS } from './js/den.js';
import { bumpToday, lastDays, accuracyOf, successReport, prune } from './js/history.js';
import { planBonus, BubbleWorld, bubblePool, MoleWorld, pickBonus, BasketWorld, BONUS_GAMES } from './js/bonus.js';
import { checkBadges, BADGES } from './js/badges.js';
import { books, bookUnlocked, pageAudio } from './js/books.js';
import { matchesTarget, normalize, canRecognize } from './js/speech.js';
import { dialogueFor, wantsDialogue, lineAudio as dialogAudio } from './js/dialogues.js';
import { pickCheckItems, checkDue, daysSinceLastCheck, saveCheck } from './js/checkup.js';
import { trackMissionEvent, ensureTodayMission } from './js/missions.js';
import { lessons as phLessons, soundById, blendOf, letterAudio, lessonDone } from './js/phonics.js';
import {
  phaseProgress, isPhaseUnlocked, isUnitUnlocked, unitProgress,
  splitRound, unitItems, unitReviewItems, curriculumConfig, playablePhases
} from './js/curriculum.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;

function check(label, condition, detail = '') {
  const ok = Boolean(condition);
  ok ? pass++ : fail++;
  const line = document.createElement('div');
  line.className = ok ? 'ok' : 'ko';
  line.textContent = `${ok ? 'OK  ' : 'KO  '} ${label}${detail ? '  — ' + detail : ''}`;
  out.appendChild(line);
}

function note(text) {
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = '    ' + text;
  out.appendChild(n);
}

/** Porta un item al box indicato scrivendo direttamente lo stato SRS. */
function forceBox(itemId, box) {
  save.progress.srs[itemId] = {
    box, due: dayIndex() + 1, seen: box, correct: box, wrong: 0, lastSeen: dayIndex()
  };
}

async function run() {
  out.innerHTML = '';
  await loadAll();
  const cfg = curriculumConfig();
  const phases = playablePhases();

  /* ---------------------------------------------------------------- */
  note(`masteryBox=${cfg.masteryBox}  soglia fase=${cfg.phaseUnlockRatio * 100}%  ripasso=${cfg.reviewWeight * 100}%`);

  /* --- 1. Ogni unita' ha un obiettivo linguistico esplicito -------- */
  const senzaObiettivo = content.worlds.filter(w => !w.objective_it || !w.structureIds?.length);
  check("ogni unita' dichiara obiettivo e struttura linguistica",
    senzaObiettivo.length === 0,
    senzaObiettivo.map(w => w.id).join(', '));

  /* --- 2. Ogni unita' (tranne la prima) ripassa le precedenti ------ */
  const senzaRipasso = content.worlds
    .filter((w, i) => i > 0 && (!w.reviewFrom || !w.reviewFrom.length));
  check("ogni unita' dopo la prima ha unita' da ripassare",
    senzaRipasso.length === 0,
    senzaRipasso.map(w => w.id).join(', '));

  /* --- 3. Partenza pulita: solo la fase 1 e' aperta ---------------- */
  resetSave();
  check("la fase 1 e' subito aperta", isPhaseUnlocked(phases[0]));
  check("la fase 2 e' chiusa a inizio gioco", !isPhaseUnlocked(phases[1]));
  check("la prima unita' e' subito giocabile", isUnitUnlocked(content.worlds[0]));
  check("la seconda unita' e' chiusa a inizio gioco", !isUnitUnlocked(content.worlds[1]));

  /* --- 4. La padronanza non si accumula in una sola sessione ------- */
  resetSave();
  const probe = content.worlds[0].newItems[0];
  recordAnswer(probe, true);
  recordAnswer(probe, true);
  recordAnswer(probe, true);
  const box = save.progress.srs[probe].box;
  check('tre risposte giuste di fila nello stesso giorno valgono un solo box',
    box === 1, `box=${box}`);
  check("e quindi l'item NON risulta padroneggiato", !isMastered(probe));

  /* --- 5. Un errore riporta l'item in cima alla coda --------------- */
  forceBox(probe, 3);
  check("con box 3 l'item e' padroneggiato", isMastered(probe));
  recordAnswer(probe, false);
  check("sbagliando torna al box 0", save.progress.srs[probe].box === 0);
  check('e smette di essere padroneggiato', !isMastered(probe));

  /* --- 6. La fase 2 si apre solo alla soglia dell'80% -------------- */
  resetSave();
  const phase1Items = content.worlds
    .filter(w => w.phase === phases[0])
    .flatMap(w => unitItems(w))
    .map(it => it.id);

  // Appena sotto la soglia: deve restare chiusa.
  const needed = Math.ceil(phase1Items.length * cfg.phaseUnlockRatio);
  phase1Items.slice(0, needed - 1).forEach(id => forceBox(id, cfg.masteryBox));
  const under = phaseProgress(phases[0]);
  check('sotto la soglia la fase 2 resta chiusa',
    !isPhaseUnlocked(phases[1]),
    `${under.mastered}/${under.total} = ${Math.round(under.ratio * 100)}%`);
  check('il gioco sa quante parole mancano', under.missing === 1, `missing=${under.missing}`);

  // Raggiunta la soglia: si apre.
  forceBox(phase1Items[needed - 1], cfg.masteryBox);
  const over = phaseProgress(phases[0]);
  check('raggiunta la soglia la fase 2 si apre',
    isPhaseUnlocked(phases[1]),
    `${over.mastered}/${over.total} = ${Math.round(over.ratio * 100)}%`);

  /* --- 7. Completare non basta: serve padroneggiare ---------------- */
  resetSave();
  // Una risposta giusta per ogni item della fase 1: unita' tutte
  // "completate", ma nessuna parola ancora padroneggiata.
  phase1Items.forEach(id => forceBox(id, 1));
  const unita = content.worlds.filter(w => w.phase === phases[0]);
  check("con una risposta giusta le unita' risultano completate",
    unita.every(w => unitProgress(w).completed));
  check("ma la fase 2 resta chiusa: completare non e' padroneggiare",
    !isPhaseUnlocked(phases[1]));

  /* --- 8. I genitori possono scavalcare la soglia ------------------ */
  save.settings.unlockAllPhases = true;
  check("l'interruttore dei genitori apre comunque le fasi", isPhaseUnlocked(phases[1]));
  save.settings.unlockAllPhases = false;

  /* --- 9. Il ripasso entra davvero in ogni partita ----------------- */
  resetSave();
  const u2 = content.worlds[1];
  unitItems(content.worlds[0]).forEach(it => forceBox(it.id, 1));   // unita' 1 "vista"
  const split = splitRound(u2, 8);
  check("la partita dell'unita' 2 include domande di ripasso",
    split.reviewCount >= cfg.minReviewItems,
    `nuovi=${split.newCount} ripasso=${split.reviewCount}`);

  const idsUnita1 = new Set(unitItems(content.worlds[0]).map(i => i.id));
  check("il ripasso pesca dalle unita' precedenti, non da quella corrente",
    split.reviewItems.length > 0 && split.reviewItems.every(it => idsUnita1.has(it.id)));

  check('nuovi + ripasso coprono tutte le domande della partita',
    split.newCount + split.reviewCount === 8,
    `${split.newCount} + ${split.reviewCount}`);

  /* --- 10. L'ultima unita' ripassa l'intero corso ------------------ */
  const last = content.worlds[content.worlds.length - 1];
  content.worlds.slice(0, -1).forEach(w => unitItems(w).forEach(it => forceBox(it.id, 1)));
  const rev = unitReviewItems(last);
  const coperte = new Set(rev.map(it => {
    const w = content.worlds.find(x => (x.newItems || []).includes(it.id));
    return w?.id;
  }));
  check("l'ultima unita' ripassa tutte le unita' precedenti",
    coperte.size === content.worlds.length - 1,
    `${coperte.size}/${content.worlds.length - 1} unita'`);

  /* --- 11. L'aiuto scritto arriva solo dopo una difficolta' -------- */
  // La parola scritta come aiuto e' una deroga alla regola della fase 1, che
  // di testo non ne mostra. Deve restare una deroga: se scattasse al primo
  // tentativo diventerebbe un modo per abituarsi a leggere invece che ad
  // ascoltare, proprio mentre l'ascolto e' cio' che si sta allenando.
  check('con zero errori nessun aiuto scritto', serveAiutoScritto(0, false) === false);
  check('con un errore nessun aiuto scritto', serveAiutoScritto(1, false) === false);
  check(`al secondo errore l'aiuto compare (soglia ${SOGLIA_AIUTO})`,
    serveAiutoScritto(2, false) === true);
  check('dove il testo c\'e\' gia\' non si aggiunge nulla',
    serveAiutoScritto(5, true) === false);

  // E la deroga non tocca la regola generale: la fase 1 resta senza testo.
  const fase1 = content.phases.find(f => f.id === 1);
  check('la fase 1 continua a non prevedere la parola scritta',
    fase1.showWrittenWord === false);

  /* --- 12. Mai due immagini uguali nella stessa domanda ------------ */
  // Nel curriculum una parola e la frase che la insegna condividono di
  // proposito la stessa illustrazione. Se i distrattori si escludessero solo
  // per id, la griglia mostrerebbe due immagini identiche con una sola
  // risposta giusta: il bambino non puo' indovinare e l'errore risulta suo.
  const tuttiItem = [...content.words, ...content.phrases].map(x => getItem(x.id));
  let collisioni = 0;
  for (const bersaglio of tuttiItem) {
    for (const d of distractors(tuttiItem, bersaglio, 4)) {
      if (d.sprite === bersaglio.sprite) collisioni++;
    }
  }
  check('nessun distrattore mostra la stessa immagine del bersaglio',
    collisioni === 0, `${collisioni} collisioni`);

  const conDoppioni = [...content.words, ...content.phrases].filter(
    (x, _i, a) => a.some(y => y.id !== x.id && y.sprite === x.sprite));
  note(`${conDoppioni.length} item condividono un'illustrazione con un altro: e' voluto, ` +
       `ma e' proprio cio' che rende necessario il filtro qui sopra`);

  const doppi = distinctBySprite([
    getItem('w_dragon'), getItem('p_q_dragon'), getItem('w_castle')
  ]);
  check('distinctBySprite elimina il doppione ma tiene il resto',
    doppi.length === 2, `${doppi.length} su 3`);

  /* --- 13. Nessun item orfano ------------------------------------- */
  const assegnati = new Set(content.worlds.flatMap(w => w.newItems));
  const tutti = [...content.words, ...content.phrases].map(i => i.id);
  const orfani = tutti.filter(id => !assegnati.has(id));
  check('nessuna parola o frase resta fuori dal curriculum',
    orfani.length === 0, orfani.join(', '));

  const rotti = [...assegnati].filter(id => !getItem(id));
  check("nessuna unita' punta a item inesistenti", rotti.length === 0, rotti.join(', '));

  /* --- la storia a episodi ---------------------------------------- */
  const capitoli = chapters();
  check('la storia ha tre stagioni: 3 prologhi, 32 capitoli, 3 epiloghi', capitoli.length === 38, String(capitoli.length));
  check('gli id dei capitoli sono unici e permanenti (st_*)',
    new Set(capitoli.map(c => c.id)).size === 38 && capitoli.every(c => /^st[23]?_[a-z]+$/.test(c.id)));
  const conCreatura = capitoli.filter(c => c.worldId);
  check('ogni capitolo di mondo punta a un mondo esistente e alla sua creatura premio',
    conCreatura.length === 32 && conCreatura.every(c => {
      const w = content.worlds.find(x => x.id === c.worldId);
      return w && w.reward === c.creatureId && c.trigger.value === c.worldId;
    }));
  check('ogni scena ha il narratore e una battuta di Pepe',
    capitoli.every(c => c.lines.filter(l => l.who === 'narrator').length >= 1
                     && c.lines.filter(l => l.who === 'pepe').length === 1));
  check('ogni creatura ritrovata dice una frase in inglese, con traduzione',
    conCreatura.every(c => c.lines.filter(l => l.who === 'creature' && l.en && l.it).length === 1)
    && capitoli.filter(c => !c.worldId).every(c => !c.lines.some(l => l.who === 'creature')));
  // Il lessico del gioco: le parole e tutte le parole delle frasi imparate.
  const lessico = new Set([...content.words.map(w => w.en.toLowerCase()), ...content.phrases.flatMap(p => p.en.toLowerCase().replace(/[!?.,]/g, '').split(/\s+/))]);
  const extra = ['hello', 'pepe', 'i', 'am', 'a', 'an', 'it\'s', 'my', 'and', 'how', 'many', 'this', 'is',
    'these', 'are', 'the', 'have', 'can', 'see', 'what', 'your', 'name', 'torrek', 'you', 'stars', 'birds', 'family', 'ears', 'hands', 'two'];
  const fuoriLessico = conCreatura.flatMap(c => c.lines.filter(l => l.who === 'creature')
    .flatMap(l => l.en.toLowerCase().replace(/[!?.,]/g, '').split(/\s+/)))
    .filter(w => w && !lessico.has(w) && !extra.includes(w));
  check("l'inglese delle creature usa il lessico del gioco", fuoriLessico.length === 0, fuoriLessico.join(' '));
  check('a inizio gioco e\' in sospeso solo il prologo',
    pendingAtStart().length === 1 && pendingAtStart()[0].id === 'st_prologue');
  check('a inizio gioco sono disponibili solo prologo (Pepe) e nessun capitolo di mondo',
    isAvailable(capitoli[0]) && conCreatura.every(c => !isAvailable(c)));
  const torrek = content.creatures.find(c => c.id === 'c_torrek');
  const dopoTorre = pendingAfterRound([torrek]).map(c => c.id);
  check("trovare Torrek fa scattare il suo capitolo e poi l'epilogo, in quest'ordine",
    dopoTorre.join(',') === 'st_tower,st_epilogue', dopoTorre.join(','));
  const festino = content.creatures.find(c => c.id === 'c_festino');
  const dopoFesta = pendingAfterRound([festino]).map(c => c.id);
  check("trovare Festino fa scattare il suo capitolo e poi l'epilogo 2", dopoFesta.join(',') === 'st2_party,st2_epilogue', dopoFesta.join(','));
  check('aprire la fase 6 fa scattare il prologo della stagione 2', pendingAfterRound([], 6).map(c => c.id).join(',') === 'st2_prologue');
  const valigetta = content.creatures.find(c => c.id === 'c_valigetta');
  check("trovare Valigetta fa scattare il suo capitolo e poi l'epilogo 3", pendingAfterRound([valigetta]).map(c => c.id).join(',') === 'st3_travel,st3_epilogue');
  check('aprire la fase 9 fa scattare il prologo della stagione 3', pendingAfterRound([], 9).map(c => c.id).join(',') === 'st3_prologue');
  check('a inizio gioco il prologo 2 non e\' disponibile ne\' in sospeso', !isAvailable(capitoli.find(c => c.id === 'st2_prologue')) && pendingAtStart().length === 1);
  check('ogni creatura della storia ha il suo capitolo', conCreatura.every(c => chapterForCreature(c.creatureId) === c));
  check('i percorsi audio della storia sono distinti',
    new Set(capitoli.flatMap(c => c.lines.map((l, n) => lineAudio(c, n)))).size === capitoli.reduce((a, c) => a + c.lines.length, 0));

  /* --- gli scrigni a sorpresa ------------------------------------- */
  const adesivi = stickers();
  check('ci sono 12 adesivi con id unici e parole esistenti',
    adesivi.length === 12 && new Set(adesivi.map(a => a.id)).size === 12 && adesivi.every(a => getItem(a.wordId)));
  const sempre = () => 0;
  check('nessuno scrigno se ne e\' gia\' uscito uno oggi', planChest(8, { rng: sempre, alreadyToday: true, roundsPlayed: 5 }) === -1);
  check('nessuno scrigno nella primissima partita', planChest(8, { rng: sempre, alreadyToday: false, roundsPlayed: 0 }) === -1);
  check('nessuno scrigno in una partita troppo corta', planChest(2, { rng: sempre, alreadyToday: false, roundsPlayed: 5 }) === -1);
  check('nessuno scrigno quando il dado non e\' fortunato', planChest(8, { rng: () => 0.99, alreadyToday: false, roundsPlayed: 5 }) === -1);
  let posti = new Set();
  for (let k = 0; k < 200; k++) posti.add(planChest(8, { rng: Math.random, alreadyToday: false, roundsPlayed: 5, chance: 1 }));
  check('lo scrigno non compare mai al primo passo ne\' nella sfida finale',
    [...posti].every(p => p >= 1 && p <= 6) && posti.size > 1, [...posti].sort().join(','));
  resetSave();
  check('a inizio gioco c\'e\' un adesivo da trovare', Boolean(nextSticker(sempre)));
  for (const a of adesivi) save.progress.stickers[a.id] = 'x';
  check('finiti gli adesivi, nextSticker restituisce null', nextSticker(sempre) === null);

  /* --- la registrazione della voce ---------------------------------- */
  check('su Safari si registra in mp4', pickMimeType(m => m === 'audio/mp4') === 'audio/mp4');
  check('su Chrome si registra in webm/opus', pickMimeType(m => m.startsWith('audio/webm')) === 'audio/webm;codecs=opus');
  check('senza formati noti il tipo resta vuoto (il browser sceglie)', pickMimeType(() => false) === '');
  check('un isTypeSupported che esplode non blocca', pickMimeType(() => { throw new Error('x'); }) === '');
  resetSave();
  const prima = canRecord();
  save.settings.voiceRecording = false;
  check("l'interruttore dei genitori spegne il microfono", canRecord() === false);
  save.settings.voiceRecording = true;
  check("riacceso, il microfono torna com'era (dipende dal browser: " + prima + ')', canRecord() === prima);

  /* --- la condivisione in famiglia ---------------------------------- */
  resetSave();
  save.child.name = 'Test';
  const mondo = content.worlds[0];
  const carta = await buildSummaryCard({ correct: 7, total: 8, newCreatures: [content.creatures[1]], world: mondo });
  check('la carta del riepilogo e\' un PNG 1200x630',
    carta.width === 1200 && carta.height === 630 && carta.toDataURL('image/png').startsWith('data:image/png'));
  const vuota = await buildSummaryCard({ correct: 0, total: 0, newCreatures: [], world: null });
  check('la carta regge anche una partita vuota (ripasso, nessuna creatura)', vuota.width === 1200);
  save.settings.familySharing = false;
  check("l'interruttore dei genitori spegne 'Condividi'", canShare() === false);

  /* --- la tana ------------------------------------------------------ */
  resetSave();
  check('a inizio gioco nella tana si puo\' mettere solo Pepe', denItems().length === 1 && denItems()[0].id === 'c_pepe');
  save.progress.creatures.c_flamup = 'x';
  save.progress.stickers.sk_sword = 'x';
  check('creature trovate e adesivi diventano cose da mettere', denItems().map(i => i.id).sort().join(',') === 'c_flamup,c_pepe,sk_sword');
  const pos = placeItem('c_pepe', -30, 250);
  check('una cosa non finisce mai oltre il bordo', pos.x === clamp(-30) && pos.y === clamp(250) && pos.x >= 6 && pos.y <= 94);
  placeItem('c_flamup', 50, 50);
  check("l'ultima cosa messa sta davanti", save.den.placed.c_flamup.z > save.den.placed.c_pepe.z);
  removeItem('c_pepe');
  check('riporre toglie dalla stanza', !isPlaced('c_pepe') && isPlaced('c_flamup'));
  setWall(WALLS.length + 1);
  check('il colore della parete gira sui quattro', save.den.wall === 1);

  /* --- lo storico giornaliero ---------------------------------------- */
  resetSave();
  bumpToday({ correct: 3, wrong: 1, minutes: 4.5 }, '2026-09-07');
  bumpToday({ correct: 2, rounds: 1, mastered: 12 }, '2026-09-07');
  const oggi = save.history['2026-09-07'];
  check('i contatori del giorno si sommano, la foto delle padroneggiate no',
    oggi.correct === 5 && oggi.wrong === 1 && oggi.rounds === 1 && oggi.minutes === 4.5 && oggi.mastered === 12);
  check("la precisione del giorno e' giusta (5/6)", accuracyOf(oggi) === 83 && accuracyOf({ correct: 0, wrong: 0 }) === null);
  const finestra = lastDays(14, '2026-09-07');
  check("gli ultimi 14 giorni sono 14, in ordine, con zeri dove non si e' giocato",
    finestra.length === 14 && finestra[0].day === '2026-08-25' && finestra[13].day === '2026-09-07' && finestra[0].rounds === 0 && finestra[13].correct === 5);
  bumpToday({ rounds: 1 }, '2026-05-01');
  prune('2026-09-07', 90);
  check("lo storico non tiene piu' di 90 giorni", !save.history['2026-05-01'] && save.history['2026-09-07']);
  for (let i = 0; i < 10; i++) bumpToday({ rounds: 1 }, `2026-09-${String(i + 1).padStart(2, '0')}`);
  const rep = successReport(41, '2026-09-10');
  check('i criteri di successo contano giorni giocati e parole padroneggiate',
    rep.days.value === 10 && rep.days.ok === true && rep.mastered.value === 41 && rep.mastered.ok === true);
  check("sotto soglia il criterio non e' raggiunto", successReport(5, '2026-09-10').mastered.ok === false);

  /* --- i giochi bonus ------------------------------------------------ */
  const cfgB = { everyRounds: 3, perDay: 3, seconds: 45, minPool: 4 };
  check('il bonus scatta solo con tre stelle', planBonus(3, { roundsSince: 5, todayCount: 0, poolSize: 6, cfg: cfgB }) && !planBonus(2, { roundsSince: 5, todayCount: 0, poolSize: 6, cfg: cfgB }));
  check('non piu\' di uno ogni tre partite', !planBonus(3, { roundsSince: 2, todayCount: 0, poolSize: 6, cfg: cfgB }));
  check('non piu\' di tre al giorno', !planBonus(3, { roundsSince: 9, todayCount: 3, poolSize: 6, cfg: cfgB }));
  check('senza abbastanza figure, niente bolle', !planBonus(3, { roundsSince: 9, todayCount: 0, poolSize: 3, cfg: cfgB }));
  const conPng = bubblePool(content.words);
  check('le bolle usano solo parole con un PNG, senza figure doppie', conPng.length >= 20 && new Set(conPng.map(w => w.sprite)).size === conPng.length && conPng.every(w => w.kind === 'word'));
  const bolle = new BubbleWorld({ w: 400, h: 300, rng: () => 0.5 });
  const b = bolle.spawn(conPng[0]);
  check('una bolla nasce dentro le pareti, dal basso', b.x >= b.r && b.x <= 400 - b.r && b.y > 300);
  b.x = b.r + 1; b.vx = -100; bolle.step(0.1);
  check('le bolle rimbalzano sulla parete', b.vx > 0 && b.x >= b.r);
  b.x = 200; b.y = 150;
  const c = bolle.spawn(conPng[1]); c.x = 200; c.y = 150;
  check('sotto il dito si prende la bolla disegnata sopra', bolle.hit(200, 150) === c && bolle.hit(5, 5) === null);
  bolle.pop(c.id);
  check('scoppiare toglie la bolla', bolle.bubbles.length === 1 && bolle.hit(200, 150) === b);

  /* --- Spunta! ------------------------------------------------------- */
  const sei = conPng.slice(0, 6);
  const talpe = new MoleWorld({ w: 600, h: 400, items: sei, rng: () => 0.5, guarantee: 2 });
  talpe.setTarget(sei[0]);
  check('nove buchi, tutti liberi all\'inizio', talpe.holes.length === 9 && talpe.freeHoles().length === 9);
  let spunte = 0, primaVolta = -1;
  for (let k = 0; k < 6; k++) { const h = talpe.next(); spunte++; if (h && h.mole.item === sei[0] && primaVolta < 0) primaVolta = k; talpe.take(h); }
  check('il bersaglio spunta entro due spunte', primaVolta >= 0 && primaVolta <= 1, String(primaVolta));
  const h1 = talpe.next(); h1.mole.up = 1;
  const r = talpe.radius(); const cx = h1.cx * 600, cy = h1.cy * 400 - r;
  check('una figura spuntata si prende toccandola, non altrove', talpe.hit(cx, cy) === h1 && talpe.hit(5, 5) === null);
  h1.mole.up = 0.2;
  check('una figura ancora nel buco non si prende', talpe.hit(cx, h1.cy * 400 - r * 0.2) === null);
  check('il gioco bonus non si ripete due volte di fila', BONUS_GAMES.length === 3 && pickBonus('bubbles', () => 0) !== 'bubbles' && pickBonus('basket', () => 0.99) !== 'basket');

  /* --- Il cestino --------------------------------------------------- */
  const cesto = new BasketWorld({ w: 600, h: 400, items: sei, rng: () => 0.5 });
  cesto.setTarget(sei[0]);
  cesto.moveBasket(-100);
  check('il cestino non esce dai bordi', cesto.basket.x === cesto.basket.w / 2);
  const g = cesto.drop(); g.item = sei[0]; g.x = 300; cesto.moveBasket(300);
  let cestoPresi = [];
  for (let k = 0; k < 200 && !cestoPresi.length; k++) cestoPresi = cesto.step(0.05);
  check('la figura giusta che cade nel cestino viene presa', cestoPresi.length === 1 && cestoPresi[0] === g);
  const cattiva = cesto.drop(); cattiva.item = sei[1]; cattiva.x = 300; cattiva.y = 300;
  let presi2 = []; for (let k = 0; k < 40; k++) presi2 = presi2.concat(cesto.step(0.05));
  check('la figura sbagliata rimbalza via senza essere presa', presi2.length === 0 && cattiva.bounced === true);

  /* --- i distintivi ------------------------------------------------- */
  resetSave();
  const strs = await (await fetch('strings.json')).json();
  check('ogni distintivo ha nome e descrizione in strings.json',
    BADGES.every(b => strs.badges?.[b.id]?.name && strs.badges?.[b.id]?.desc) && new Set(BADGES.map(b => b.id)).size === BADGES.length);
  const fresco = { progress: { creatures: {}, stickers: {}, storySeen: {}, badges: {} }, stats: {}, streak: {} };
  check('a inizio gioco nessun distintivo', checkBadges(fresco, { mastered: 0, stickerCount: 12 }).length === 0);
  const s1 = { progress: { creatures: { c_flamup: 1, c_rocktail: 1, c_prisma: 1, c_numo: 1 }, stickers: {}, storySeen: { st_epilogue: 'x' }, badges: {} }, stats: { totalRounds: 1, chestsOpened: 1 }, streak: { best: 7 } };
  const presi = checkBadges(s1, { mastered: 26, stickerCount: 12 }).map(b => b.id).sort();
  check('le condizioni si valutano sul salvataggio',
    presi.join(',') === 'bd_first_chest,bd_first_round,bd_mastered_10,bd_mastered_25,bd_phase1_creatures,bd_story_done,bd_streak_3,bd_streak_7', presi.join(','));
  check('un distintivo preso non si riprende', checkBadges(s1, { mastered: 26, stickerCount: 12 }).length === 0 && Object.keys(s1.progress.badges).length === 8);

  /* --- i libretti ---------------------------------------------------- */
  resetSave();
  const libri = books();
  check('ci sono sei libretti con otto pagine ciascuno', libri.length === 6 && libri.every(b => b.pages.length === 8));
  check('ogni libretto ha la lunghezza prevista (±40%)', libri.every(b => { const n = b.pages.reduce((a, p) => a + p.en.split(/\s+/).length, 0); return n >= b.targetWords * 0.6 && n <= b.targetWords * 1.4; }));
  const lessicoLibri = new Set([...content.words.map(w => w.en.toLowerCase()), ...content.phrases.flatMap(p => p.en.toLowerCase().replace(/[!?.,:"]/g, '').split(/\s+/))]);
  const extraLibri = ['a', 'an', 'the', 'is', 'it', 'at', 'she', 'he', 'his', 'says', 'say', 'looks', 'sees', 'walks', 'comes', 'waits', 'opens', 'lives', 'sit', 'up', 'not', 'with', 'in', 'to', 'of', 'like', 'now', 'too', 'my', 'your', 'i', 'am', 'are', 'you', 'why', 'alone', 'and', 'little', 'baby', 'crack', 'hello', 'goodbye', 'good', 'night', 'end', 'thank', 'friends', 'friend', 'colour', 'do', 'cannot', 'sleepy', 'dark', 'owl', 'chameleon', 'pepe', 'prisma', 'numo', 'fiammino', 'baluce', 'torrek', 'where', 'what', 'how', 'many', 'there', 'name', 'eight', 'stars', 'eggs', 'cats', 'trees', 'dinosaurs', 'eyes', 'has', 'have', 'can', 'see', 'bridge', 'tower', 'no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'nine', 'ten'];
  const fuoriLibri = libri.flatMap(b => b.pages.flatMap(p => p.en.toLowerCase().replace(/[!?.,:"…]/g, '').replace(/\.\.\./g, ' ').split(/\s+/))).filter(w => w && !lessicoLibri.has(w) && !extraLibri.includes(w));
  check("i libretti usano il lessico del gioco (piu' poche parole di servizio)", fuoriLibri.length === 0, [...new Set(fuoriLibri)].join(' '));
  check('a inizio gioco nessun libretto e\' aperto', libri.every(b => !bookUnlocked(b)));
  check('le tracce delle pagine hanno percorsi distinti', new Set(libri.flatMap(b => b.pages.map((p, n) => pageAudio(b, n)))).size === 48);

  /* --- Dillo tu: la conferma morbida --------------------------------- */
  check("la parola giusta fra le alternative sentite conferma", matchesTarget('dragon', ['a dragon', 'drag on']) && matchesTarget('dragon', ['the dragon!']));
  check('una parola diversa non conferma', !matchesTarget('dragon', ['dinosaur', 'drink']));
  check("per una frase bastano due terzi delle parole, in qualunque ordine", matchesTarget("It's a red egg.", ['it is a red egg', 'red egg it is']) && !matchesTarget("It's a red egg.", ['red']));
  check("apostrofi e punteggiatura non contano", normalize("What's your name?") === 'what is your name');
  check('il riconoscimento vocale e\' spento di default', canRecognize() === false);
  check("'sayit' e' fra i giochi di ogni unita'", content.worlds.every(w => w.minigames.includes('sayit')));

  /* --- i dialoghi ---------------------------------------------------- */
  check("ogni unita' ha il suo dialogo, con tre scambi e tre risposte per scambio",
    content.worlds.every(w => { const d = dialogueFor(w.id); return d && d.creatureId === w.reward && d.turns.length === 3 && d.turns.every(t => t.replies.length === 3 && t.good.en); }));
  check('il dialogo chiude sempre le prime due partite, poi una su tre', wantsDialogue(0) && wantsDialogue(1) && !wantsDialogue(2, () => 0.9) && wantsDialogue(5, () => 0.1));
  const dl = dialogueFor('world_dragons');
  check('i percorsi audio dei dialoghi sono distinti', new Set([...dl.turns.flatMap((t, i) => ['say', 'r0', 'r1', 'r2', 'good'].map(k => dialogAudio(dl, i, k))), dialogAudio(dl, null, 'hm0'), dialogAudio(dl, null, 'hm1')]).size === 17);

  /* --- il check del mese ------------------------------------------- */
  resetSave();
  const scelte = pickCheckItems(['a','b','c','d','e','f','g','h','i','j','k','l'], 10, () => 0.3);
  check('il check pesca dieci parole senza doppioni', scelte.length === 10 && new Set(scelte).size === 10);
  check('con meno di dieci parole le prende tutte', pickCheckItems(['a','b','c']).length === 3);
  check('mai fatto: il check e\' dovuto', checkDue('2026-09-08') && daysSinceLastCheck('2026-09-08') === null);
  saveCheck([{ id: 'w_dragon', ok: true }, { id: 'w_cat', ok: false }], '2026-08-01');
  check('dopo 38 giorni e\' dovuto di nuovo, dopo 7 no', checkDue('2026-09-08') && !checkDue('2026-08-08') && save.checks[0].ok === 1 && save.checks[0].n === 2);

  /* --- missioni fuori dallo schermo -------------------------------- */
  resetSave();
  const casa = content.missions.filter(m => m.type === 'home');
  check('otto missioni a casa su sedici', casa.length === 8 && content.missions.length === 16);
  ensureTodayMission();
  save.daily.missionId = casa[0].id; save.daily.missionProgress = 0; save.daily.missionDone = false;
  check('una risposta giusta non chiude una missione a casa', trackMissionEvent({ correct: true }) === false && !save.daily.missionDone);
  check('la conferma di un adulto la chiude', trackMissionEvent({ home: true }) === true && save.daily.missionDone);

  /* --- prima del cartone --------------------------------------------- */
  check('ogni cartone ha dieci parole e tre frasi del gioco da fare prima',
    content.media.every(m => m.prepWords?.length === 10 && m.prepPhrases?.length === 3 && [...m.prepWords, ...m.prepPhrases].every(id => getItem(id))));

  /* --- i suoni ------------------------------------------------------- */
  resetSave();
  const lez = phLessons();
  check('quattro lezioni di suoni, 24 suoni in tutto', lez.length === 4 && new Set(lez.flatMap(l => l.soundIds)).size === 24 && lez.flatMap(l => l.soundIds).every(id => soundById(id)));
  check('ogni suono ha parole del gioco che lo contengono', content.phonics.sounds.every(s => s.wordIds.length >= 3 && s.wordIds.every(id => getItem(id))));
  let visti = new Set(); let ok = true;
  for (const l of lez) { l.soundIds.forEach(id => visti.add(id)); for (const w of l.blendWords) { const b = blendOf(w); if (!b || !b.soundIds.every(id => visti.has(id))) ok = false; } }
  check('le fusioni usano solo suoni gia\' incontrati', ok && content.phonics.blends.length === 24);
  check("le vocali brevi non hanno l'audio isolato (la sintesi le leggerebbe come nomi)", ['ph_a','ph_e','ph_i','ph_o','ph_u'].every(id => !soundById(id).isolated && letterAudio(soundById(id)).startsWith('en/sound.')));
  check('a inizio gioco nessuna lezione e\' fatta', lez.every(l => lessonDone(l) === 0));

  resetSave();

  const v = document.createElement('div');
  v.id = 'verdict';
  v.className = fail === 0 ? 'ok' : 'ko';
  v.textContent = fail === 0 ? `PASS — ${pass} controlli` : `FAIL — ${fail} su ${pass + fail}`;
  out.appendChild(v);
}

run().catch(err => {
  out.innerHTML = `<div class="ko">ERRORE: ${err.message}</div><pre>${err.stack}</pre>
    <div id="verdict" class="ko">FAIL</div>`;
});
</script>
</body>
</html>
